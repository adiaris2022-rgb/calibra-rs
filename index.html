<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALIBRA RS v0.6</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  color:#172033;
}
header{
  background:#fff;
  padding:20px 28px;
  border-bottom:1px solid #e5e7eb;
}
.brand{
  font-size:26px;
  font-weight:800;
}
.subtitle{
  color:#7b8494;
  margin-top:4px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:28px 20px;
}
.login{
  max-width:560px;
  margin:70px auto;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:26px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(23,32,51,.05);
}
h1,h2,h3{margin-top:0}
input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d7dce4;
  border-radius:10px;
  font-size:15px;
  margin-top:7px;
}
textarea{min-height:110px}
button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  background:#172033;
  color:white;
  font-size:15px;
  cursor:pointer;
}
button.secondary{
  background:#eef2f7;
  color:#172033;
}
button.success{background:#16834b}
button.danger{background:#c62828}
button.full{width:100%;margin-top:20px}
label{
  display:block;
  margin-top:15px;
  font-weight:600;
}
.demo{
  background:#eef7ff;
  padding:16px;
  border-radius:12px;
  margin-top:18px;
  line-height:1.6;
}
.error{
  color:#c62828;
  margin-top:12px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.nav button.active{
  background:#172033;
  color:#fff;
}
.nav button{
  background:#e9edf3;
  color:#172033;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
}
.stat .label{
  color:#7b8494;
  font-size:14px;
}
.stat .value{
  font-size:32px;
  font-weight:800;
  margin-top:10px;
}
.section{display:none}
.section.active{display:block}
.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:999px;
