<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CALIBRA RS</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#172033}header{background:#fff;padding:18px 24px;border-bottom:1px solid #e5e7eb}main{max-width:1100px;margin:auto;padding:24px}.brand{font-weight:800;font-size:22px}.sub{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.num{font-size:30px;font-weight:800;margin-top:8px}.alert{margin-top:20px;border-left:5px solid #d92d20}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;background:#172033;color:#fff;text-decoration:none}</style></head><body><header><div class="brand">CALIBRA RS</div><div class="sub">Medical Equipment Control Tower</div></header><main><h1>Executive Dashboard</h1><p class="sub">Prototype MVP — data demo</p><section class="grid"><div class="card">TOTAL ALAT<div class="num" id="equipment">—</div></div><div class="card">KALIBRASI VALID<div class="num" id="valid">—</div></div><div class="card">SEGERA JATUH TEMPO<div class="num" id="nearDue">—</div></div><div class="card">EXPIRED<div class="num" id="expired">—</div></div></section><div class="card alert"><b>Temuan terbaru</b><p id="finding">Memuat…</p><a class="btn" href="#">Lihat Detail</a></div></main><script>fetch('/api/dashboard').then(r=>r.json()).then(d=>{for(const k of ['equipment','valid','nearDue','expired'])document.getElementById(k).textContent=d[k].toLocaleString('id-ID');const x=d.recent[0];document.getElementById('finding').textContent=`${x.equipment} (${x.code}) — ${x.finding} — ${x.time}`})</script></body></html>
